# Preloaded before /etc/runit/2 sets kernel.modules_disabled=1.
# Without this, USB devices enumerate but their drivers can never load, so no
# /dev/ttyACM*, /dev/ttyUSB* or /dev/sd* ever appears until the next reboot.
#
# Requires /etc/runit/2 to run modprobe once per module (xargs -rn1); with the
# stock "xargs -r modprobe" only the first name loads and the rest are passed
# to it as module parameters.

# USB serial - Arduino, ESP8266/ESP32, CH340, CP210x, FTDI, PL2303
cdc-acm
usbserial
ftdi_sio
cp210x
ch341
pl2303

# USB mass storage - external drives
usb-storage
uas
sd_mod

# Filesystems commonly found on external drives
vfat
exfat
ntfs3
