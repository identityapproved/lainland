unbind r
bind r source-file ~/.config/tmux/tmux.conf

set -g default-terminal "tmux-256color"
set -as terminal-features "*:extkeys"

set -g prefix C-s

# Splitting Windows
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# VIM motions
setw -g mode-keys vi
# Pane resize
bind -r h resize-pane -L 13
bind -r j resize-pane -D 13
bind -r k resize-pane -U 13
bind -r l resize-pane -R 13

# Pane selection
# bind-key h select-pane -L
# bind-key j select-pane -D
# bind-key k select-pane -U
# bind-key l select-pane -R

set -g mouse on
set -g history-limit 50000
set -g display-time 4000

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Windows navigation
bind C-p previous-window
bind C-n next-window

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'christoomey/vim-tmux-navigator'

# python3 -m pip install --user libtmux
# yain python-libtmux
set -g @plugin 'ofirgall/tmux-window-name'
set -g @tmux_window_name_show_program_args "True"

set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-copycat'

set -g @plugin 'tmux-plugins/tmux-yank'
# set-clipboard on

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'off'

# Claude Code bottom pane (prefix + C)
bind C split-window -v -l 40% -c "#{pane_current_path}" "claude --resume"

# Status bar
set -g status-position top
set -g status-style "bg=#1A1A1A,fg=#CE7688"
set -g status-left "#[fg=#C1B48E,bold] #S #[default]"
set -g status-right "#[fg=#5A5341]%Y-%m-%d #[fg=#CE7688]%H:%M "
set -g status-left-length 30
set -g window-status-format "#[fg=#5A5341] #I:#W "
set -g window-status-current-format "#[fg=#C1B48E,bold] #I:#W "
set -g pane-border-style "fg=#2A2A2A"
set -g pane-active-border-style "fg=#CE7688"
set -g message-style "bg=#1A1A1A,fg=#C1B48E"

if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
