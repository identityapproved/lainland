# Lain tmux.
#
# Self-contained: no plugin manager. Everything the old TPM stack actually did
# for us is bound explicitly below, so tmux starts instantly and never clones
# from the network on its own.

unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Terminal
#
# RGB is the load-bearing line. tmux-256color advertises no RGB capability, so
# without this tmux quantises 24-bit colour into the 256-colour cube and the
# Lain palette collapses onto the xterm pink band: hightertiary #A49978 lands on
# #AF8787 (a rose), and highprimary #C1B48E and highsecondary #B5A985 both land
# on #AFAF87 — distinct roles stop being distinct and anything emitting
# truecolour, the Claude Code status line included, reads as washed-out mauve.
set -g default-terminal "tmux-256color"
set -as terminal-features "*:RGB"
set -as terminal-features "*:extkeys"

# Lets the terminal disambiguate C-h from Backspace, which otherwise share byte
# 0x08. Required for the C-h pane bind below to be safe.
set -g extended-keys on

# Claude Code renders its status line through chalk, and its color detection
# hard-downgrades to 256 colours whenever $TMUX is set:
#
#   if (CLAUDE_CODE_TMUX_TRUECOLOR) return false;
#   if (TMUX && level > 2) { level = 2; ... }
#
# 256 is where the Lain palette dies. chalk's rgbToAnsi256 sends success-fg
# #FFDCB9 to index 224 (#FFD7D7) and highsecondary #B5A985 to 181 (#D7AFAF) --
# cream and ochre both come out pink, which is what made the bar read as Rose
# Pine. This is the documented opt-out and it leaves $TMUX alone, so Claude's
# tmux pane backend still works. Do not set FORCE_COLOR to try to fix this:
# Claude's colour-upgrade path bails out early whenever FORCE_COLOR is defined,
# so it makes things worse.
set-environment -g CLAUDE_CODE_TMUX_TRUECOLOR 1

set -g prefix C-s

# From tmux-sensible, the two defaults that actually matter: ESC latency in vi
# mode, and focus reporting so editors notice pane changes.
set -sg escape-time 10
set -g focus-events on

# Splits
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Vi mode; v selects, y yanks to the Wayland clipboard.
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# Pane resize — prefix, repeatable
bind -r h resize-pane -L 13
bind -r j resize-pane -D 13
bind -r k resize-pane -U 13
bind -r l resize-pane -R 13

# Pane selection — no prefix.
#
# This has to live in tmux rather than kitty. kitty maps ctrl+shift+hjkl to
# neighboring_window, but Claude Code turns on the kitty keyboard protocol and
# swallows those, so pane switching dies from inside a Claude pane. tmux sits
# between kitty and Claude, so a -n bind here is seen first and always wins.
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# C-l is clear-screen upstairs, so hand it back on prefix + C-l.
bind C-l send-keys C-l

set -g mouse on
set -g history-limit 50000
set -g display-time 4000

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind C-p previous-window
bind C-n next-window

# Claude Code bottom pane (prefix + C)
bind C split-window -v -l 40% -c "#{pane_current_path}" "claude --resume"

# Theme
#
# lain.tmux replaces the status, window, pane-border and message styling that
# used to be spelled out here by hand, and covers the surfaces those lines never
# reached: copy-mode, menus, popups, the clock, display-panes.
#
# Every option below is read once, when the run-shell line at the bottom of this
# file executes, so all of it has to come before that line. Change something,
# then prefix + r.
#
# Loaded from the working tree, which keeps the "no plugin manager" promise at
# the top of this file and means an edit in ~/github/lain.tmux lands on the next
# reload. To install it the way any other user would instead, comment the
# run-shell line at the bottom and uncomment these two:
#
#   set -g @plugin 'identityapproved/lain.tmux'
#   run-shell ~/.config/tmux/plugins/tpm/tpm
#
# then prefix + I. That path clones over https, so it needs the repo public.

# One thing no option below can compensate for: kitty runs at
# background_opacity 0.85, so the bar is composited over the desktop instead of
# being drawn on the #1A1A1A the palette was measured against. The theme's own
# contrast check puts the date at 5.20:1 and the clock at 5.45:1, both clear of
# the 4.5:1 floor, but those numbers only hold on an opaque ground - at 0.85
# the dim steps lift toward whatever is behind the window and the tail of the
# bar goes murky. background_opacity 1.0 in kitty.conf is the only real fix.

# --- look ---------------------------------------------------------------
#
# Uncomment exactly one block. They set the same two options, so a second
# uncommented block just overwrites the first.

# powerline: pointed separators and per-module icons. Needs an icon font, which
# kitty already loads here (IosevkaTerm Nerd Font Mono, plus Symbols Nerd Font
# mapped over the private use area). Font presence cannot be detected from
# inside tmux, so @lain_glyphs is a declaration, never a guess.
set -g @lain_separator powerline
set -g @lain_glyphs nerd

# square: filled blocks, nothing between them. The plugin default, and the
# nearest thing to the nine hardcoded lines this block replaced.
# set -g @lain_separator square
# set -g @lain_glyphs ascii

# wire: no fills at all - flat text joined by a thin rule, every segment on the
# bar background. The quiet one - square and powerline paint each module a solid
# fill, which is a lot of lit area; wire has none.
# set -g @lain_separator wire
# set -g @lain_glyphs nerd

# Same, with geometric shapes from the box-drawing block instead of icons, for
# a host with no icon font:
# set -g @lain_separator wire
# set -g @lain_glyphs unicode

# none: no separator and no icons, text on the bar background only.
# set -g @lain_separator none
# set -g @lain_glyphs ascii

# The two axes are independent, so any pairing works - square blocks with nerd
# icons, wire rules with no glyphs at all:
# set -g @lain_separator square
# set -g @lain_glyphs unicode

# --- modules ------------------------------------------------------------
#
# The bar is a list per side, drawn in the order written. Available:
#
#   layer       session name, flips to accent while the prefix is pending
#   knights     prefix indicator, collapses to nothing at rest
#   node        hostname, see @lain_node_long
#   wired_path  current directory, see @lain_path_full
#   present_day date and clock
#   psyche      one-minute load average          (polled)
#   coolant     battery charge                   (polled, needs a battery)
#   layer_git   branch of the active pane's repo (polled, needs git)
#
# An unknown name is skipped rather than breaking the bar.
set -g @lain_modules_left "layer knights"
set -g @lain_modules_right "wired_path layer_git psyche present_day"

# Minimal, static only - nothing polled, so no background process at all:
# set -g @lain_modules_left "layer"
# set -g @lain_modules_right "present_day"

# Everything at once. coolant is listed but will never appear on this machine:
# a polled module stays off the bar until it has a value, and there is no
# battery here.
# set -g @lain_modules_left "layer knights node"
# set -g @lain_modules_right "wired_path layer_git psyche coolant present_day"

# --- polling ------------------------------------------------------------
#
# The bar itself never forks: every static module compiles to a native tmux
# format, so a redraw costs nothing regardless of pane count. The polled ones
# are computed by a single background process per server, once per interval,
# and written into a @lain_cache_* option the bar reads. One process for the
# server, not one shell per segment per redraw per pane.
set -g @lain_poll_interval 15

# --- layout -------------------------------------------------------------
set -g @lain_status_position bottom
set -g @lain_status_interval 5
set -g @lain_status_left_length 40
set -g @lain_status_right_length 60

# set -g @lain_status_position top
# set -g @lain_status_justify centre    # left (default), centre, right
# set -g @lain_window_index layer       # LAYER:01 name, instead of 1:name
# set -g @lain_transparent on           # bar background drops to the terminal
# set -g @lain_pane_border_status top   # per-pane labels: off, top, bottom

# --- module detail ------------------------------------------------------
# set -g @lain_show_prefix off          # stop layer flipping on prefix
# set -g @lain_show_date off            # clock only, no date
# set -g @lain_prefix_text WIRED        # label knights shows, default PREFIX
# set -g @lain_node_long on             # full hostname, not the short one
# set -g @lain_path_full on             # whole path, not the basename
# set -g @lain_date_format "%a %d %b"   # default %Y-%m-%d
# set -g @lain_clock_format "%H:%M:%S"  # default %H:%M

# --- debugging ----------------------------------------------------------
# Keeps the generated conf instead of deleting it and reports the path in a
# message, so the compiled formats can be read back.
# set -g @lain_debug on

run-shell ~/github/lain.tmux/lain.tmux
