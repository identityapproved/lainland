[Settings]
# libadwaita ignores gtk-theme-name, so GTK4 gets the theme through
# ~/.config/gtk-4.0/gtk.css, which imports ~/.themes/lain/gtk-4.0/gtk.css.
# The name is still set here for the GTK4 apps that are not libadwaita.
gtk-theme-name=lain
gtk-icon-theme-name=lainicons
gtk-cursor-theme-name=lainicons
gtk-cursor-theme-size=24
gtk-font-name=Iosevka Nerd Font 11
gtk-application-prefer-dark-theme=1
