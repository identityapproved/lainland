[Settings]
gtk-application-prefer-dark-theme=true
# Adwaita-dark, not a Lain GTK theme: none exists. The palette is applied on top
# via gtk.css (see the GTK Surface Overrides table in lain-colors.md), which is
# enough for libadwaita apps and the two GTK consumers this repo themes
# (liferea, nautilus-alikes).
gtk-theme-name=Adwaita-dark
# Bibata-Modern-Ice is what lainland used; it is not installed on this host, so
# the value would silently fall back. Adwaita is present everywhere.
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=23
