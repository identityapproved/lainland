[Settings]
# libadwaita ignores gtk-theme-name entirely, so GTK4 gets the theme through
# ~/.config/gtk-4.0/gtk.css, which chezmoi creates as a symlink into
# ~/.themes/lain/gtk-4.0/ (source: symlink_gtk.css.tmpl). A symlink rather than
# an @import: GTK resolves a relative @import against the sheet's own location,
# and the theme's gtk.css imports libadwaita.css from beside itself, so the
# sheet has to be read from inside the theme directory. This is the same thing
# nwg-look's export-gtk4-symlinks does -- that export is turned off in
# nwg-look/config so the two do not fight over the file.
# The theme name is still set here for the GTK4 apps that are not libadwaita.
gtk-theme-name=lain
gtk-icon-theme-name=lainicons
gtk-cursor-theme-name=lainicons
gtk-cursor-theme-size=24
gtk-font-name=Iosevka Nerd Font 11
gtk-application-prefer-dark-theme=1
