# ┃                     Defaults Configuration                  ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

$mainMod = SUPER

# Default app commands and shared modifiers used by keybinds.
#
# The terminal is resolved at chezmoi apply time by ~/.config/scripts/term,
# which picks the first installed of kitty/foot/alacritty and normalises the
# per-emulator flag spelling. `term --float` sets both a title and an app_id of
# termfloat, so the windowrule below and sway's for_window both match.
$terminal = $HOME/.config/scripts/term
$tmux = $HOME/.config/scripts/term -e tmux
$termfloat = $HOME/.config/scripts/term --float
$fileManager = $HOME/.config/scripts/term -e yazi
$menu = tofi-drun
$locker = hyprlock
$captureFull = $HOME/.config/hypr/scripts/screenshot_swappy.sh full
$captureOutput = $HOME/.config/hypr/scripts/screenshot_swappy.sh output
$capturing = $HOME/.config/hypr/scripts/screenshot_swappy.sh region
