# Lain colors. Only what Hyprland actually uses.

# Core Lain palette (Hypr rgb() style)
$lain_back_1 = rgb(000000)
$lain_back_2 = rgb(1A1A1A)
$lain_back_3 = rgb(2A2A2A)

$lain_fore_1 = rgb(CE7688)
$lain_fore_2 = rgb(BA6A7B)
$lain_fore_3 = rgb(A05969)
$lain_fore_4 = rgb(965363)

$lain_high_1 = rgb(C1B48E)
$lain_high_2 = rgb(B5A985)
$lain_high_3 = rgb(A49978)

# Hyprland usage variables
$lain_inactive_border = $lain_fore_4
$lain_border_gradient = $lain_fore_4 $lain_fore_3 $lain_fore_2 $lain_fore_1 $lain_high_3 $lain_high_2 $lain_high_1 $lain_high_2 $lain_fore_1 $lain_fore_2

# Shadow colors (rgba format required in 0.55+)
$lain_shadow_active = rgba(c1b48e88)
$lain_shadow_inactive = rgba(1a1a1a00)

# Glow colors (0xRRGGBBAA)
$lain_glow_active = 0xCE768844
$lain_glow_inactive = 0x00000001

# groupbar uses 0xRRGGBBAA values
$lain_group_active = 0xFFB1C3ff
$lain_group_inactive = 0x5D333Cff
$lain_group_text = 0xC1B48Eff
