# ---------- Appearance ----------
font_family      IosevkaTerm Nerd Font Mono
bold_font        IosevkaTerm Nerd Font Mono SemiBold
italic_font      auto
bold_italic_font auto
symbol_map U+E000-U+F8FF Symbols Nerd Font
font_size 11.0

hide_window_decorations yes
background_opacity 0.85

# Lain colors. Palette: lain-colors.md (private repo).
include themes/lain-theme.conf

cursor_trail 3
cursor_trail_decay 0.1 0.4

window_padding_width 4

# splits = tmux-style panes; stack = zoom (one pane fullscreen)
enabled_layouts splits,stack

remember_window_size  no
initial_window_width  1000
initial_window_height 1080
single_instance       no

enable_audio_bell false
repaint_delay     8

# ---------- URL & Interaction ----------
detect_urls  yes
paste_actions quote-urls-at-prompt,replace-dangerous-control-codes

# ---------- Scrollback ----------
scrollback_lines              10000
scrollback_pager              less
scrollback_pager_history_size 20000

# ---------- Key maps ----------
map shift+enter      send_text all \x1b[13;2u
map shift+up         scroll_line_up
map shift+page_up    scroll_page_up
map shift+down       scroll_line_down
map shift+page_down  scroll_page_down

# Tabs
map ctrl+shift+t         new_tab
map ctrl+shift+n         next_tab
map ctrl+shift+p         previous_tab
map ctrl+shift+w         close_tab
map ctrl+shift+alt+right move_tab_forward
map ctrl+shift+alt+left  move_tab_backward

# Windows (splits), inheriting the current pane's working directory
map ctrl+shift+\  launch --location=vsplit --cwd=current
map ctrl+shift+-  launch --location=hsplit --cwd=current
map ctrl+shift+h  neighboring_window left
map ctrl+shift+j  neighboring_window down
map ctrl+shift+k  neighboring_window up
map ctrl+shift+l  neighboring_window right
map ctrl+shift+space  next_layout
map ctrl+shift+z  toggle_layout stack
map ctrl+shift+q  close_window
map ctrl+shift+left   resize_window narrower 4
map ctrl+shift+right  resize_window wider 4
map ctrl+shift+up     resize_window taller 4
map ctrl+shift+down   resize_window shorter 4

# ---------- Misc ----------
enable_osc52_kitty yes
