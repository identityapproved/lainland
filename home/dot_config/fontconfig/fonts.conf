<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Default the generic families to Iosevka; keep the system fonts as
       fallback so glyphs Iosevka lacks (CJK, emoji) still resolve, and keep
       Symbols Nerd Font behind the monospace alias for the icon range that the
       patched cuts do not carry. -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>Iosevka Nerd Font</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Iosevka Nerd Font</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>IosevkaTerm Nerd Font Mono</family>
      <family>Symbols Nerd Font Mono</family>
    </prefer>
  </alias>
</fontconfig>
