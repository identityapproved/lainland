# Portal backends under mango. xdg-desktop-portal reads
# $XDG_CURRENT_DESKTOP-portals.conf, and mango/config.conf sets that to
# "wlroots", so this is the file that applies here.
#
# gtk first for FileChooser and Settings -- Settings is what carries the GTK
# theme and the dark-mode preference into Flatpak and Electron apps, so a Lain
# GTK theme only reaches them through this. wlr handles Screenshot/ScreenCast.
[preferred]
default=gtk;wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
