[general]
unsafe-accounts-conf = false

[ui]
sidebar-width      = 22
threading-enabled  = true
mouse-enabled      = true

[viewer]
# bat with --paging=never dumps colorized text straight into aerc's view pane:
# no less, no mouse capture, so kitty selection + copy works normally.
pager        = bat --style=plain --color=always --paging=never
# Prefer the HTML part when a message has both (marketing mail etc. put the
# real content in text/html and only a "enable HTML" stub in text/plain).
alternatives = text/html,text/plain

[filters]
text/plain    = colorize
# full path: the bare name does not always resolve on Gentoo
text/html     = /usr/libexec/aerc/filters/html
text/calendar = calendar
# kitty graphics protocol: render image attachments inline in the message pane
image/*       = kitten icat --align left --stdin
