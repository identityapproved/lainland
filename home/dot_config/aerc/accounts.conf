[Personal]
source        = imaps://identityapproved%40gmail.com@imap.gmail.com:993
outgoing      = smtps://identityapproved%40gmail.com@smtp.gmail.com:465
smtp-auth     = login
from          = identityapproved <identityapproved@gmail.com>
copy-to       = "[Gmail]/Sent Mail"
cache-headers = true

# Credentials:
#   By default aerc prompts for the password on launch (it is not stored here;
#   unsafe-accounts-conf = false forbids a plaintext password in this file).
#   Gmail requires an *app password* (IMAP enabled + 2FA), not your login password.
#
# To avoid typing it each launch, store it once:
#   secret-tool store --label='aerc gmail' service aerc account personal
# then uncomment:
source-cred-cmd   = secret-tool lookup service aerc account personal
outgoing-cred-cmd = secret-tool lookup service aerc account personal
