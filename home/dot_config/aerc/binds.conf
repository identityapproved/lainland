# Navigation only: j/k to move, Tab to cycle tabs/accounts.
# Everything else is driven explicitly with : commands
# (:archive, :delete, :reply, :cf "[Gmail]/Sent Mail", :cp, etc.)

[messages]
j = :next <Enter>
k = :prev <Enter>
g = :select 0<Enter>
G = :select -1<Enter>
<Enter> = :view <Enter>
<Tab> = :next-tab <Enter>
<Backtab> = :prev-tab <Enter>
# folder list (left pane): no focus cursor, drive it by command
<C-j> = :next-folder <Enter>
<C-k> = :prev-folder <Enter>
# q closes the current tab; Q quits aerc entirely
q = :close <Enter>
Q = :quit <Enter>
# marking for bulk actions: v toggles current, V marks all, then :delete / :archive
v = :mark -t <Enter>
V = :mark -a <Enter>
# Gmail: delete = mark read + move to Trash (works on marks too, so v v v then d)
d = :read<Enter>:move "[Gmail]/Trash"<Enter>
# archive = remove from inbox (-> All Mail)
e = :archive flat<Enter>
r = :read<Enter>
R = :unread<Enter>

[view]
j = :next <Enter>
k = :prev <Enter>
q = :close <Enter>
Q = :quit <Enter>
<Tab> = :next-tab <Enter>
<Backtab> = :prev-tab <Enter>
# MIME parts / attachments
J = :next-part <Enter>
K = :prev-part <Enter>
o = :open <Enter>
s = :save ~/Downloads/ <Enter>
S = :save -a ~/Downloads/ <Enter>
d = :read<Enter>:move "[Gmail]/Trash"<Enter>

[compose::editor]
<Tab> = :next-field <Enter>

[compose::review]
<Tab> = :next-tab <Enter>
