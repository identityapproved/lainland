# -*- conf -*-

[main]
font=IosevkaTerm Nerd Font Mono:size=11
font-bold=IosevkaTerm Nerd Font Mono:style=Bold:size=11
font-italic=IosevkaTerm Nerd Font Mono:style=Italic:size=11
font-bold-italic=IosevkaTerm Nerd Font Mono:style=Bold Italic:size=11
pad=8x8
dpi-aware=yes

# Matches kitty's bold_is_bright: promotes regular0-7 to bright0-7 so \e[1;30m
# does not render black on black. Plain "yes" blends towards white instead.
bold-text-in-bright=palette-based

[bell]
urgent=no
notify=no
visual=no

[scrollback]
lines=10000

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

# Lain palette; see lain-colors.md.
# Mirrors kitty/themes/lain-theme.conf slot for slot so the two terminals
# render identically. Change both together.
[colors-dark]
alpha=0.85
background=000000
foreground=C1B48E

cursor=000000 C1B48E

selection-foreground=000000
selection-background=C1B48E

# regular (0-7)
regular0=000000
regular1=CE7688
regular2=968C6E
regular3=FFDCB9
regular4=8A8A8A
regular5=BA6A7B
regular6=A49978
regular7=BABABA

# bright (8-15)
bright0=7A7A7A
bright1=FFB1C3
bright2=B5A985
bright3=FFDCB9
bright4=9A9A9A
bright5=CE7688
bright6=B5A985
bright7=FFFFFF

urls=C1B48E

