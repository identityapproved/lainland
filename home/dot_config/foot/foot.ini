# -*- conf -*-

[main]
font=IosevkaTerm Nerd Font Mono:size=11
font-bold=IosevkaTerm Nerd Font Mono:style=Bold:size=11
font-italic=IosevkaTerm Nerd Font Mono:style=Italic:size=11
font-bold-italic=IosevkaTerm Nerd Font Mono:style=Bold Italic:size=11
pad=8x8
dpi-aware=yes

# Left off deliberately; it does NOT match kitty's bold_is_bright. kitty only
# promotes colors 0-7 when they arrive as indices (SGR 30-37). foot's
# palette-based matches on RGB value, so any bold truecolor #000000 also hits
# regular0 and comes out as bright0 (#7A7A7A). Every bold black-on-light run in
# the Lain themes is spelled as truecolor -- yazi's hovered row
# (fg #000000, bg #C1B48E, bold) and the tmux bar's pink segments -- so those
# rendered grey on foot while kitty kept them black. The \e[1;30m black-on-black
# case this was guarding against is rare enough to lose.
bold-text-in-bright=no

[bell]
urgent=no
notify=no
visual=no

[scrollback]
lines=10000

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

# Lain palette; see lain-colors.md.
# Mirrors kitty/themes/lain-theme.conf slot for slot so the two terminals
# render identically. Change both together.
[colors-dark]
alpha=0.85
background=000000
foreground=C1B48E

cursor=000000 C1B48E

selection-foreground=000000
selection-background=C1B48E

# regular (0-7)
regular0=000000
regular1=CE7688
regular2=968C6E
regular3=FFDCB9
regular4=8A8A8A
regular5=BA6A7B
regular6=A49978
regular7=BABABA

# bright (8-15)
bright0=7A7A7A
bright1=FFB1C3
bright2=B5A985
bright3=FFDCB9
bright4=9A9A9A
bright5=CE7688
bright6=B5A985
bright7=FFFFFF

urls=C1B48E

# vim: ft=dosini
