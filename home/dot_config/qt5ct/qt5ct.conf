# qt5ct — Lain. Palette: lain-colors.md (private repo).
# The color scheme in colors/Lain.conf is vendored from
# Ascaniolamp/Hyprlain and is already exact palette values.
[Fonts]
fixed="Adwaita Mono,14,-1,5,50,0,0,0,0,0,Regular"
general="Adwaita Sans,14,-1,5,50,0,0,0,0,0,Regular"

[Interface]
activate_item_on_single_click=2
buttonbox_layout=1
cursor_flash_time=1000
dialog_buttons_have_icons=2
double_click_interval=400
gui_effects=General, AnimateMenu, AnimateCombo, AnimateTooltip, AnimateToolBox
keyboard_scheme=2
menus_have_icons=true
show_shortcuts_in_context_menus=true
stylesheets=@Invalid()
toolbutton_style=4
underline_shortcut=2
wheel_scroll_lines=3

[Troubleshooting]
force_raster_widgets=1
ignored_applications=@Invalid()

[Appearance]
color_scheme_path=~/.config/qt5ct/colors/Lain.conf
custom_palette=true
icon_theme=lainicons
standard_dialogs=default
style=Windows