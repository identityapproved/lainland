# More option see https://github.com/DreamMaoMao/mango/wiki/

# Environment variables
env=MOZ_ENABLE_WAYLAND,1
env=XDG_CURRENT_DESKTOP,wlroots
env=XCURSOR_THEME,lainicons
env=XCURSOR_SIZE,24
# Qt apps ignore the GTK theme; qt6ct applies the Lain palette and drives Qt5
# via qt5ct's config, so one value covers both.
env=QT_QPA_PLATFORMTHEME,qt6ct
# XDG_DATA_DIRS is exported in ~/.zprofile before mango starts; do NOT override
# it here or walker loses flatpak .desktop entries.

# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0

border_radius=0
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.9

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
ov_tab_mode=1
ov_no_resize=1
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_theme=lainicons
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us,ua
# Scroll Lock cycles us <-> ua
xkb_rules_options=grp:sclk_toggle

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gappih=3
gappiv=3
gappoh=7
gappov=7
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=2

# Lain colors — 0xRRGGBBAA. root=background, border=inactive, focus=active,
# urgent=peak accent; window-state colors walk the High and Fore ramps.
# No trailing comments: mango parses bare key=value and takes the rest of the
# line as the value.
rootcolor=0x000000ff
bordercolor=0x965363ff
focuscolor=0xCE7688ff
urgentcolor=0xFFB1C3ff
maximizescreencolor=0xC1B48Eff
scratchpadcolor=0xA49978ff
globalcolor=0x968C6Eff
overlaycolor=0xB5A985ff
splitcolor=0xBA6A7Bff
dropcolor=0xC1B48E55

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:monocle
tagrule=id:8,layout_name:monocle
tagrule=id:9,layout_name:scroller

# Autostart
exec-once=gentoo-pipewire-launcher
exec-once=awww-daemon & sleep 1 && ~/.config/awww/randomize.sh loop
# quickshell retired — walker launcher + waybar (top)
exec-once=swayosd-server
# ironbar disabled — too resource-heavy (per-tag watchers + 400ms show_if polls).
# exec-once=ironbar
# exec-once=~/.config/scripts/mango-ipc.py active-class
exec-once=walker --gapplication-service
exec-once=waybar
exec-once=mako
exec-once=sleep 2 && mpd  # music daemon (reads ~/.config/mpd/mpd.conf; wait for pipewire output)
# mpd speaks no MPRIS on its own; mpd-mpris bridges it so the XF86Audio
# transport keys (which go through playerctl) can drive rmpc.
exec-once=sleep 3 && mpd-mpris -no-instance  # stable bus name: org.mpris.MediaPlayer2.mpd
exec-once=clipse -clear && clipse -listen  # clear history at boot, then start listener (SUPER+c opens the TUI)
exec-once=sleep 4 && ~/.config/waybar/scripts/toggle_mic.sh mute  # SoloCast muted by default at login

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,r,reload_config

# Terminal & apps (mirrors Hyprland defaults)
bind=SUPER,Return,spawn,~/.config/scripts/term
bind=SUPER+SHIFT,Return,spawn,~/.config/scripts/term -e tmux
bind=SUPER+CTRL,Return,spawn,~/.config/scripts/term --float
bind=SUPER,c,spawn,~/.config/scripts/term --float -e clipse
bind=SUPER,e,spawn,~/.config/scripts/term -e yazi
# App launcher (walker, replaces quickshell drawer)
bind=SUPER,space,spawn,walker

# Bar (waybar) control
bind=SUPER,b,spawn,pkill -SIGUSR1 waybar
bind=SUPER+SHIFT,b,spawn,pkill -SIGUSR2 waybar

# Core window actions
bind=SUPER,q,killclient,
bind=SUPER+SHIFT,m,quit
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,f,togglefakefullscreen,
bind=SUPER,v,togglefloating,
bind=SUPER,a,togglemaximizescreen,
bind=SUPER,g,toggleglobal,
bind=SUPER,o,toggleoverlay,
bind=SUPER,i,minimized,
bind=SUPER+SHIFT,i,restore_minimized

# Screen lock / power
bind=SUPER,F12,spawn,swaylock
bind=SUPER+SHIFT,F12,spawn,wlogout

# Focus — vim keys
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down
bind=SUPER,Tab,focusstack,next

# Focus floating windows only (mango has no floating filter on focusstack;
# the script walks them over IPC, as Hyprland's `cyclenext, floating` did)
bind=SUPER,d,spawn,~/.config/mango/scripts/focus-floating.sh next
bind=SUPER+SHIFT,d,spawn,~/.config/mango/scripts/focus-floating.sh prev

# Move window — vim keys
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down

# Resize window
bind=SUPER+CTRL+SHIFT,h,resizewin,-50,0
bind=SUPER+CTRL+SHIFT,l,resizewin,+50,0
bind=SUPER+CTRL+SHIFT,k,resizewin,0,-50
bind=SUPER+CTRL+SHIFT,j,resizewin,0,+50
bind=SUPER+CTRL+SHIFT,Left,resizewin,-50,0
bind=SUPER+CTRL+SHIFT,Right,resizewin,+50,0
bind=SUPER+CTRL+SHIFT,Up,resizewin,0,-50
bind=SUPER+CTRL+SHIFT,Down,resizewin,0,+50

# Move floating window
bind=CTRL+SHIFT,Left,movewin,-50,0
bind=CTRL+SHIFT,Right,movewin,+50,0
bind=CTRL+SHIFT,Up,movewin,0,-50
bind=CTRL+SHIFT,Down,movewin,0,+50

# Tags — SUPER+[1-9] view, SUPER+CTRL+[1-9] move client
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Tag navigation
bind=SUPER,Left,viewtoleft,0
bind=SUPER,comma,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright,0
bind=SUPER,period,viewtoright_have_client,0
bind=SUPER+CTRL,Left,tagtoleft,0
bind=SUPER+CTRL,Right,tagtoright,0

# Scratchpad
bind=SUPER,minus,toggle_scratchpad
bind=SUPER,equal,toggle_scratchpad
# Named scratchpad: Quake drop-down console. Args are appid,title,command --
# 'none' skips a field, both regex. The command field must not contain commas;
# the bind line is split on them.
bind=SUPER,grave,toggle_named_scratchpad,^console$,none,~/.config/mango/scripts/console.sh

# Overview & layout
bind=ALT,Tab,toggleoverview,
bind=SUPER,n,switch_layout

# Scroller layout
bind=SUPER+ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=SUPER+ALT+CTRL,Left,scroller_stack,left
bind=SUPER+ALT+CTRL,Right,scroller_stack,right
bind=SUPER+ALT+CTRL,Up,scroller_stack,up
bind=SUPER+ALT+CTRL,Down,scroller_stack,down

# Gaps
bind=ALT+SHIFT,x,incgaps,1
bind=ALT+SHIFT,z,incgaps,-1
bind=ALT+SHIFT,r,togglegaps

# Monitor
bind=ALT+SHIFT,Left,focusmon,left
bind=ALT+SHIFT,Right,focusmon,right
bind=SUPER+ALT,Left,tagmon,left
bind=SUPER+ALT,Right,tagmon,right

# Volume
bind=NONE,XF86AudioRaiseVolume,spawn,swayosd-client --output-volume raise --max-volume 150
bind=NONE,XF86AudioLowerVolume,spawn,swayosd-client --output-volume lower
bind=NONE,XF86AudioMute,spawn,swayosd-client --output-volume mute-toggle
bind=SUPER,m,spawn,~/.config/waybar/scripts/toggle_mic.sh toggle
bind=NONE,XF86AudioMicMute,spawn,~/.config/waybar/scripts/toggle_mic.sh toggle

# Playback
bind=NONE,XF86AudioPlay,spawn,swayosd-client --playerctl play-pause
bind=NONE,XF86AudioNext,spawn,swayosd-client --playerctl next
bind=NONE,XF86AudioPrev,spawn,swayosd-client --playerctl prev

# Brightness
bind=NONE,XF86MonBrightnessUp,spawn,swayosd-client --brightness raise
bind=NONE,XF86MonBrightnessDown,spawn,swayosd-client --brightness lower

# Screenshots (grim + slurp + swappy)
bind=NONE,Print,spawn,~/.config/mango/scripts/screenshot.sh full
bind=SUPER,Print,spawn,~/.config/mango/scripts/screenshot.sh output
bind=SUPER+SHIFT,Print,spawn,~/.config/mango/scripts/screenshot.sh region
# Xbox Series Share button (xpad emits KEY_RECORD) - works in-game, no Steam overlay needed
bind=NONE,XF86AudioRecord,spawn,~/.config/mango/scripts/screenshot.sh game

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
# mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Window rules
# Float + center the scratch terminals (SUPER+CTRL+Return, SUPER+c clipse).
# Both launch kitty with --title termfloat; mango tiles by default, so this is
# what makes them behave like Hyprland's floating scratchpad. title is a regex.
windowrule=isfloating:1,width:0.55,height:0.55,title:termfloat
# Steam on tag 7 (monocle) so Big Picture and its popups get the full area.
# Anchored to match ONLY appid "steam" — unanchored it also caught steam_app_*
# game windows and dragged games onto tag 7.
windowrule=appid:^steam$,tags:7
# Games get tag 8 to themselves: nothing else spawns there, so no window event
# can ever re-tile a running game out of fullscreen.
windowrule=appid:^steam_app_.*,tags:8
# virt-manager on tag 6 (tile); the appid is shared by the manager and every VM
# console, so the whole workflow tiles together.
windowrule=appid:^virt-manager$,tags:6
# Drop-down console (SUPER+`). isfloating:1 is load-bearing: show_scratchpad()
# only recomputes geometry for non-floating windows, so this is what makes
# offsety survive each toggle. width/height are screen ratios; offsety is a
# PERCENTAGE of free space, not pixels (-100 flush under waybar, 0 centred).
windowrule=isnamedscratchpad:1,isfloating:1,width:0.9,height:0.55,offsety:-100,animation_type_open:slide,animation_type_close:slide,appid:^console$

# Layer rules
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi
layerrule=animation_type_open:zoom,layer_name:walker
layerrule=animation_type_close:zoom,layer_name:walker
