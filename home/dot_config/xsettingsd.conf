# xsettingsd — carries the GTK theme to X11 clients under XWayland.
Net/ThemeName "lain"
Net/IconThemeName "lainicons"
Gtk/CursorThemeName "lainicons"
Gtk/FontName "Iosevka Nerd Font 11"
Net/EnableEventSounds 1
EnableInputFeedbackSounds 0
Xft/Antialias 1
Xft/Hinting 1
Xft/HintStyle "hintmedium"
Xft/RGBA "rgb"
