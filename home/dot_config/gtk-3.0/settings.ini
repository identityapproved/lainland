[Settings]
# Lain GTK theme + icons/cursors, both vendored into this repo and applied to
# ~/.themes/lain and ~/.icons/lainicons. Origin: Ascaniolamp/Hyprlain.
gtk-theme-name=lain
gtk-icon-theme-name=lainicons
gtk-cursor-theme-name=lainicons
gtk-cursor-theme-size=24
gtk-font-name=Iosevka Nerd Font 11
gtk-application-prefer-dark-theme=1

gtk-toolbar-style=GTK_TOOLBAR_BOTH_HORIZ
gtk-toolbar-icon-size=GTK_ICON_SIZE_LARGE_TOOLBAR
gtk-button-images=1
gtk-menu-images=1
gtk-enable-event-sounds=1
gtk-enable-input-feedback-sounds=0
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintmedium
gtk-xft-rgba=rgb
