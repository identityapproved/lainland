# MPD config — dotfiles repo, symlinked to ~/.config/mpd
# Runtime/state lives outside the repo (see ~/.cache/mpd, ~/.local/share/mpd)
# so nothing mutable lands in git.

# Music location (temporary — currently on the gigabyte drive)
music_directory     "/mnt/music"

# Playlists are user data, keep them out of the repo
playlist_directory  "~/.local/share/mpd/playlists"

# Volatile state -> cache
db_file             "~/.cache/mpd/database"
state_file          "~/.cache/mpd/state"
sticker_file        "~/.cache/mpd/sticker.sql"
pid_file            "~/.cache/mpd/pid"
log_file            "~/.cache/mpd/log"

# Listen on loopback for clients (rmpc/ncmpcpp default to 127.0.0.1:6600)
bind_to_address     "127.0.0.1"
port                "6600"
# Local Unix socket: gives local clients (rmpc) full/admin permissions
bind_to_address     "~/.cache/mpd/socket"

restore_paused      "yes"
auto_update         "yes"
follow_outside_symlinks "yes"
follow_inside_symlinks  "yes"

audio_output {
    type            "pipewire"
    name            "PipeWire Output"
}

# Decode metadata for tag display / album art from embedded tags
input {
    plugin          "curl"
}
